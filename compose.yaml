services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_student_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d smart_student_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://planner:planner@postgres:5432/smart_student_planner
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-me}
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:

